<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#e9efed; --surface:#ffffff; --surf2:#f3f7f5;
  --ink:#16222a; --muted:#5d6c74; --faint:#92a0a6; --line:#e4ebe9;
  --brand:#0e7a6e; --brand-d:#0a5d54; --brand-tint:#e0f1ee;
  --ok:#1c9c5f; --ok-tint:#e3f5ec; --bad:#df3a58; --bad-tint:#fde6ea;
  --amber:#e1900b; --amber-tint:#fcefd9;
  --shadow:0 1px 2px rgba(13,40,38,.05),0 12px 28px -16px rgba(13,40,38,.22);
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Noto Sans JP","Meiryo",system-ui,-apple-system,sans-serif;
  --mono:"SFMono-Regular","SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
.mono{font-family:var(--mono);font-feature-settings:"tnum" 1;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:8px;}

.wrap{min-height:100dvh;display:flex;justify-content:center;background:var(--bg);}
.app{position:relative;width:100%;max-width:468px;min-height:100dvh;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;}
@media(min-width:520px){
  .wrap{padding:20px 0;align-items:flex-start;}
  .app{min-height:calc(100dvh - 40px);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);}
}

.view{flex:1;display:flex;flex-direction:column;min-height:0;animation:fade .3s ease;}
.pad{padding:22px 18px 30px;overflow-y:auto;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.hello{margin-bottom:16px;}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--brand);text-transform:uppercase;}
.h1{font-size:22px;line-height:1.35;font-weight:800;margin:4px 0 0;letter-spacing:-.01em;}
.topnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.topnav-t{font-weight:800;font-size:17px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;}

.stat-card{display:flex;align-items:center;gap:18px;}
.ring{position:relative;flex:0 0 auto;}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-big{font-size:30px;font-weight:800;}
.ring-small{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.04em;}
.stat-rows{flex:1;display:flex;flex-direction:column;gap:11px;}
.stat-row{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:9px;}
.stat-row:last-child{border-bottom:none;padding-bottom:0;}
.stat-k{font-size:13px;color:var(--muted);}
.stat-v{font-size:19px;font-weight:800;}
.stat-sub{font-size:13px;color:var(--faint);font-weight:600;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 15px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease;}
.tile:active{transform:scale(.97);}
.tile-ic{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;background:var(--brand-tint);color:var(--brand-d);margin-bottom:7px;}
.tile-name{font-weight:800;font-size:16px;}
.tile-desc{font-size:12px;color:var(--muted);line-height:1.4;}
.tile-sub{font-size:12px;color:var(--brand);font-weight:700;margin-top:5px;}

.cat-card{padding:16px 16px 14px;}
.cat-chips{display:flex;flex-wrap:wrap;gap:8px;}
.cat-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--brand-d);transition:transform .1s,background .12s;}
.cat-chip:active{transform:scale(.96);}
.cat-chip-c{background:var(--brand-tint);color:var(--brand-d);font-size:11px;padding:1px 7px;border-radius:99px;}

.bank{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:16px;padding:15px 16px;color:var(--ink);}
.bank-l{display:flex;align-items:center;gap:12px;color:var(--brand-d);}
.bank-t{display:block;font-weight:800;font-size:15px;color:var(--ink);}
.bank-s{display:block;font-size:12px;color:var(--muted);margin-top:2px;}

.quiz{padding:0;}
.qbar{display:flex;align-items:center;gap:12px;padding:14px 14px 10px;}
.iconbtn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;color:var(--muted);background:var(--surf2);transition:color .12s,background .12s;}
.iconbtn.on{color:var(--amber);background:var(--amber-tint);}
.iconbtn:active{transform:scale(.92);}
.qprog{flex:1;}
.qcount{font-size:14px;font-weight:800;}
.qcount-d{color:var(--faint);font-weight:600;}
.track{height:7px;border-radius:99px;background:var(--surf2);overflow:hidden;margin-top:5px;}
.track.sm{height:6px;margin-top:6px;}
.fill{height:100%;background:var(--brand);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1);}
.fill.ok{background:var(--ok);} .fill.bad{background:var(--bad);}

.timer{align-self:center;background:var(--surf2);color:var(--brand-d);font-weight:800;font-size:14px;padding:5px 14px;border-radius:99px;margin:0 0 6px;}
.timer.low{background:var(--bad-tint);color:var(--bad);}

.qscroll{flex:1;overflow-y:auto;padding:6px 18px 16px;}
.qcard{padding:4px 0 14px;}
.tf-q{padding-bottom:6px;}
.chip{display:inline-block;font-size:11px;font-weight:700;color:var(--brand-d);background:var(--brand-tint);padding:4px 10px;border-radius:99px;margin-bottom:12px;}
.qjudge{font-size:13px;font-weight:700;color:var(--brand);margin-bottom:8px;letter-spacing:.02em;}
.qtext{font-size:19px;line-height:1.6;font-weight:700;white-space:pre-wrap;letter-spacing:-.005em;}
.qimg{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:14px;border:1px solid var(--line);background:var(--surf2);margin-top:13px;}

.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.tf-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:132px;background:var(--surface);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transition:border-color .12s,background .12s,transform .1s;}
.tf-btn:active{transform:scale(.97);}
.tf-btn:disabled{cursor:default;}
.tf-sym{font-size:54px;line-height:1;}
.tf-sym.maru{color:var(--brand);}
.tf-sym.batsu{color:#65737b;}
.tf-lbl{font-size:14px;font-weight:800;color:var(--muted);}
.tf-btn.sel{border-color:var(--brand);background:var(--brand-tint);}
.tf-btn.sel .tf-lbl{color:var(--brand-d);}
.tf-btn.correct{border-color:var(--ok);background:var(--ok-tint);}
.tf-btn.correct .tf-sym,.tf-btn.correct .tf-lbl{color:var(--ok);}
.tf-btn.wrong{border-color:var(--bad);background:var(--bad-tint);}
.tf-btn.wrong .tf-sym,.tf-btn.wrong .tf-lbl{color:var(--bad);}
.tf-btn.dim{opacity:.5;}

.exp{margin-top:14px;border-radius:14px;padding:14px;border:1px solid var(--line);animation:slidein .25s ease;}
.exp.ok{background:var(--ok-tint);border-color:#bfe6cf;}
.exp.bad{background:var(--bad-tint);border-color:#f4c4cf;}
.exp-head{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;margin-bottom:6px;}
.exp.ok .exp-head{color:var(--ok);} .exp.bad .exp-head{color:var(--bad);}
.exp-text{font-size:14px;line-height:1.65;color:var(--ink);white-space:pre-wrap;}
@keyframes slidein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.flash{min-height:180px;}
.flash-front{width:100%;min-height:180px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:18px;background:var(--surf2);}
.flash-hint{color:var(--muted);font-weight:700;}
.flash-back{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--surface);box-shadow:var(--shadow);animation:slidein .25s ease;}
.flash-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;}
.flash-tf{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.flash-sym{font-size:46px;line-height:1;}
.flash-sym.maru{color:var(--brand);}
.flash-sym.batsu{color:#65737b;}
.flash-word{font-size:20px;font-weight:800;}
.flash-back .exp-text{margin-top:10px;padding-top:12px;border-top:1px solid var(--line);}

.actionbar{position:sticky;bottom:0;padding:13px 18px calc(15px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--surface) 72%,rgba(255,255,255,0));}
.action-hint{text-align:center;font-size:13px;font-weight:600;color:var(--faint);padding:16px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:15px;padding:15px;font-weight:800;font-size:16px;transition:transform .1s,opacity .12s,background .12s;}
.btn:active{transform:scale(.985);}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px -6px rgba(14,122,110,.6);}
.btn.primary:disabled{background:#bcd2ce;box-shadow:none;cursor:default;}
.btn.ghost{background:var(--surf2);color:var(--brand-d);border:1px solid var(--line);}
.btn.ghost:disabled{opacity:.45;cursor:default;}
.btn.flat{background:transparent;color:var(--muted);padding:12px;font-size:15px;}
.btn.danger{color:var(--bad);}
.btn.danger-solid{background:var(--bad);color:#fff;}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:11px;width:auto;}
.grade,.navrow{display:flex;gap:10px;}
.half{flex:1;}

.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
.catrow{margin-bottom:13px;}
.catrow:last-child{margin-bottom:0;}
.catrow-top{display:flex;justify-content:space-between;align-items:baseline;}
.cat-name{font-size:14px;font-weight:600;}
.cat-val{font-size:14px;font-weight:800;}
.cat-sub{color:var(--faint);font-weight:600;font-size:12px;}

.qsum{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
.qsum-n{font-size:30px;font-weight:800;color:var(--ink);}
.qsum-l{font-size:14px;color:var(--muted);font-weight:600;}
.qactions{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
.hint{font-size:12px;color:var(--faint);margin:0 0 14px;}
.filter-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;}
.catbar{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch;}
.catbar-chip{flex:0 0 auto;background:var(--surf2);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;transition:background .12s,color .12s,border-color .12s;}
.catbar-chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:36px 10px;background:var(--surf2);border:1px dashed var(--line);border-radius:14px;}
.qlist{display:flex;flex-direction:column;}
.qrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);transition:transform .1s,border-color .12s;}
.qrow:active{transform:scale(.99);}
.qrow.ro{cursor:default;box-sizing:border-box;}
.qrow.ro:active{transform:none;}
.qrow-body{flex:1;min-width:0;}
.qrow-cat{display:block;font-size:11px;font-weight:700;color:var(--brand);margin-bottom:2px;}
.qrow-q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.45;}
.qrow-thumb{flex:0 0 auto;width:44px;height:44px;object-fit:cover;border-radius:9px;border:1px solid var(--line);}
.qrow-ed{flex:0 0 auto;color:var(--faint);display:flex;}
.ans-chip{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;font-size:20px;font-weight:700;}
.ans-chip.sm{width:26px;height:26px;font-size:15px;border-radius:8px;}
.ans-chip.ok{background:var(--ok-tint);color:var(--ok);}
.ans-chip.bad{background:var(--bad-tint);color:var(--bad);}
.reset{margin-top:12px;}

.flabel{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 7px;}
.inp{width:100%;border:2px solid var(--line);border-radius:13px;padding:13px 14px;font-size:15px;background:var(--surf2);color:var(--ink);font-family:var(--sans);}
.inp:focus{outline:none;border-color:var(--brand);background:var(--surface);}
.inp.search{margin-bottom:12px;}
.cat-suggest{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.sg-chip{background:var(--surf2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);transition:background .12s,color .12s,border-color .12s;}
.sg-chip.on{background:var(--brand-tint);color:var(--brand-d);border-color:var(--brand);}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.seg-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-weight:800;font-size:15px;color:var(--muted);transition:border-color .12s,background .12s,color .12s;}
.seg-sym{font-size:24px;line-height:1;}
.seg-btn.on-ok{border-color:var(--ok);background:var(--ok-tint);color:var(--ok);}
.seg-btn.on-bad{border-color:var(--bad);background:var(--bad-tint);color:var(--bad);}
.img-tools{display:flex;gap:8px;}
.img-tools .btn{width:auto;}
.edit-img{margin-bottom:10px;}
.editor-actions{margin-top:22px;}

.lead{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 14px;}
.ghint{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;color:var(--brand-d);margin-bottom:10px;}
.ghint-c{font-size:11px;color:var(--muted);}
.pre{font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--ink);margin:0;}
.example .btn{margin-top:10px;}
.ta{width:100%;border:2px solid var(--line);border-radius:15px;padding:14px;font-family:var(--mono);font-size:13px;line-height:1.7;resize:vertical;background:var(--surf2);color:var(--ink);}
.ta:focus{outline:none;border-color:var(--brand);background:var(--surface);}
.note{font-size:12px;line-height:1.7;color:var(--faint);margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}

.prev{margin-top:14px;}
.prev-empty,.prev-hint{font-size:13px;color:var(--faint);line-height:1.6;background:var(--surf2);border:1px dashed var(--line);border-radius:13px;padding:14px;}
.prev-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.prev-count{font-size:14px;font-weight:800;}
.prev-count.ok{color:var(--ok);} .prev-count.bad{color:var(--bad);}
.prev-skip{font-size:12px;color:var(--amber);font-weight:700;background:var(--amber-tint);padding:3px 9px;border-radius:99px;}
.prev-cats{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--brand-d);font-weight:700;background:var(--brand-tint);padding:7px 11px;border-radius:10px;margin-bottom:10px;}
.prev-list{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:13px;padding:8px;background:var(--surf2);}
.prev-row{display:flex;align-items:center;gap:9px;padding:7px 6px;border-bottom:1px solid var(--line);}
.prev-row:last-child{border-bottom:none;}
.prev-body{flex:1;min-width:0;}
.prev-cat{display:block;font-size:10px;font-weight:700;color:var(--brand);margin-bottom:1px;}
.prev-q{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.prev-more{text-align:center;font-size:12px;color:var(--muted);padding:8px;}

.confirm{margin-top:14px;border:1px solid #f4c4cf;background:var(--bad-tint);border-radius:15px;padding:15px;}
.confirm-t{font-size:14px;line-height:1.6;color:var(--ink);margin:0 0 12px;font-weight:600;}
.confirm-actions{display:flex;gap:10px;}
.confirm-actions .btn{width:auto;flex:1;padding:13px;}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:99px;box-shadow:var(--shadow);z-index:30;max-width:88%;text-align:center;animation:slidein .25s ease;}
.toast.ok{background:var(--ok);} .toast.bad{background:var(--bad);}

.pubbox{background:var(--surf2);border:1px solid var(--line);border-radius:16px;padding:14px;margin:6px 0 14px;}
.pubbox-t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--brand-d);margin-bottom:10px;}
.pubbox .btn{width:100%;}
.pubbox .note{margin:10px 0 0;}
.pub-meta{font-size:12px;color:var(--muted);margin-top:9px;}
.link{background:none;border:none;color:var(--brand);font-weight:700;font-size:12px;text-decoration:underline;padding:0;cursor:pointer;}
.pub-more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;}
.pub-more summary{font-size:12px;color:var(--faint);cursor:pointer;}
.pub-more .btn{width:100%;margin-top:9px;}
.set-step{font-size:13px;line-height:1.65;color:var(--ink);margin-bottom:10px;}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

<script>
"use strict";

function z2h(s){ return String(s).replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xfee0); }); }
function hashId(str){ var h=0; for(var i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

var TRUE_SET=["○","◯","〇","まる","マル","正","正しい","true","t","o","yes","y","1","✓","✔","correct"];
var FALSE_SET=["×","✕","✗","ばつ","バツ","ばっ","誤","誤り","false","f","x","no","n","0","incorrect"];
function toBool(v){
  if(typeof v==="boolean") return v;
  var s=z2h(String(v).trim()).toLowerCase();
  if(TRUE_SET.indexOf(s)>=0) return true;
  if(FALSE_SET.indexOf(s)>=0) return false;
  return null;
}
function normalizeQuestion(q){
  var question=String(q.question||"").trim();
  var answer=toBool(q.answer);
  if(!question || answer===null) return null;
  return { id:q.id||hashId(question), category:(q.category||"").trim(), question:question, answer:answer,
    explanation:q.explanation?String(q.explanation).trim():"", image:q.image?String(q.image).trim():"" };
}

function ensureUniqueIds(list){ var seen={}; for(var i=0;i<list.length;i++){ var q=list[i]; var id=q.id||hashId(q.question); var base=id, n=2; while(seen[id]){ id=base+"_"+(n++); } seen[id]=1; q.id=id; } return list; }
var RE_Q=/^(?:Q|q|問題|設問|問)\s*[0-9０-９]*\s*[.\)）、。:：]?\s*(.*)$/;
var RE_EXP=/^(?:解説|説明|ポイント|補足|Explanation)\s*[:：.\)）]?\s*(.*)$/;
var RE_ANS=/^(?:答え|答|正解|解答|正誤|Answer|ANSWER|Ans|ans)\s*[:：.\)）]?\s*(.+)$/;
var RE_IMG=/^(?:画像|図|image|img)\s*[:：]\s*(\S.*)$/i;
function parseText(text){
  var lines=text.replace(/\r/g,"").split("\n");
  var out=[], skipped=0, cur=null, cat="", lastExp=false, phase=null;
  function flush(){
    if(!cur) return;
    var n=normalizeQuestion({category:cur.category,question:cur.question.trim(),answer:cur.answer,explanation:cur.explanation.trim(),image:cur.image});
    if(n) out.push(n); else if(cur.question.trim()) skipped++;
    cur=null;
  }
  for(var k=0;k<lines.length;k++){
    var line=lines[k].trim();
    if(line===""){ lastExp=false; continue; }
    if(line.charAt(0)==="#"){ cat=line.replace(/^#+\s*/,"").trim(); continue; }
    var mq=line.match(RE_Q);
    if(mq){ flush(); cur={category:cat,question:mq[1]||"",answer:null,explanation:"",image:""}; phase="q"; lastExp=false; continue; }
    if(!cur) continue;
    var mImg=line.match(RE_IMG);
    if(mImg){ cur.image=mImg[1].trim(); lastExp=false; phase="a"; continue; }
    var me=line.match(RE_EXP);
    if(me){ cur.explanation=me[1]||""; lastExp=true; phase="a"; continue; }
    var ma=line.match(RE_ANS);
    if(ma){ cur.answer=ma[1]; lastExp=false; phase="a"; continue; }
    if(cur.answer===null && !/\s/.test(line) && line.length<=6 && toBool(line)!==null){ cur.answer=line; phase="a"; continue; }
    if(phase==="q") cur.question+=(cur.question?"\n":"")+line;
    else if(lastExp) cur.explanation+="\n"+line;
  }
  flush();
  return {questions:out, skipped:skipped};
}
function parseImport(text){
  var t=text.trim();
  if(t.charAt(0)==="[" || t.charAt(0)==="{"){
    try{
      var data=JSON.parse(t);
      var arr=Array.isArray(data)?data:(data.questions||[]);
      var qs=arr.map(normalizeQuestion).filter(Boolean);
      return {questions:qs, skipped:arr.length-qs.length};
    }catch(e){}
  }
  return parseText(text);
}

": "令和7年度", "question": "回し板は、工作物に取り付けて、工作物に主軸の回転を伝えるものである。", "answer": "×", "explanation": "回し板は主軸側に取り付け、工作物に付けた回し金（ケレ）と係合して回転を伝える。工作物に取り付けるのは回し金のほう。"}, {"category": "令和7年度", "question": "日本産業規格（JIS）によれば、普通旋盤のセンタとは、工作物の回転中心を支える部品である。", "answer": "○", "explanation": "センタは工作物の回転中心を支える部品で正しい。"}, {"category": "令和7年度", "question": "はん用の穴加工に用いるドリルの先端角は、一般に、90°である。", "answer": "×", "explanation": "はん用ドリルの先端角は一般に118°。90°ではない。"}, {"category": "令和7年度", "question": "ダイヤモンドチップバイトは、鋼の加工に向いている。", "answer": "×", "explanation": "ダイヤモンドは鉄（鋼）と化学反応（炭素が鉄に拡散）して激しく摩耗するため鋼の加工に不向き。アルミ・銅など非鉄金属の加工に向く。"}, {"category": "令和7年度", "question": "鋼材を旋削加工するときの切削条件は、角材や丸材などの素材形態にかかわらず同じである。", "answer": "×", "explanation": "素材形態で条件は変わる。角材は断続切削で衝撃が大きく、丸材より低速・低送りなど条件を変える。"}, {"category": "令和7年度", "question": "一般に、旋盤の切削条件で、送り量を大きくすると、切削温度は低くなる。", "answer": "×", "explanation": "送り量を大きくすると切削抵抗・発熱が増え、切削温度は高くなる。"}, {"category": "令和7年度", "question": "日本産業規格（JIS）によれば、回転速度は、工作機械関係では、普通は毎分あたりの回転数（min⁻¹）で表す。", "answer": "○", "explanation": "回転速度の単位は min⁻¹。"}, {"category": "令和7年度", "question": "構成刃先は、切削速度を速くするほど発生しやすい。", "answer": "×", "explanation": "構成刃先は切削速度が低いときに発生しやすい。速くすると発生しにくくなる（消失する）。"}, {"category": "令和6年度", "question": "マシニングセンタは、主として回転工具を使用し、フライス削り、中ぐり、穴あけ及びねじ立てを含む複数の切削加工ができ、かつ、加工プログラムに従って工具を自動交換できる数値制御工作機械である。", "answer": "○", "explanation": "JIS のマシニングセンタの定義どおり。自動工具交換（ATC）を備える点が特徴。"}, {"category": "令和6年度", "question": "切削用超硬質工具材料の識別記号Pは、主に鋳鉄の加工に使用される。", "answer": "×", "explanation": "P種（青）は主に鋼（スチール）の加工用。鋳鉄の加工に使うのはK種（赤）。ステンレスは M種（黄）。"}, {"category": "令和6年度", "question": "一般に、不水溶性切削油剤よりも水溶性切削油剤のほうが冷却作用が優れている。", "answer": "○", "explanation": "水を主成分とする水溶性は比熱・熱伝導が大きく冷却性に優れる（潤滑性は油性が上）。"}, {"category": "令和6年度", "question": "工作機械に使用する潤滑油の効果の一つとして、防錆効果がある。", "answer": "○", "explanation": "潤滑油には潤滑・冷却・防錆・密封などの作用がある。"}, {"category": "令和6年度", "question": "空気圧装置と油圧装置を比較した場合、一般に、使用圧力が高い場合は、空気圧装置が用いられる。", "answer": "×", "explanation": "高い使用圧力には油圧装置を用いる。空気圧は比較的低圧で使用する。"}, {"category": "令和6年度", "question": "締金（締板）を使って工作物を締め付ける場合、締付ボルトはできるだけ工作物から離して締め付けるほうがよい。", "answer": "×", "explanation": "締付ボルトはできるだけ工作物に近づけるほうが、てこの原理で締付け力が大きくなり良い。"}, {"category": "令和6年度", "question": "角度を測定するものの一つとして、サインバーがある。", "answer": "○", "explanation": "サインバーはブロックゲージと組み合わせて角度を精密に測定・設定する。"}, {"category": "令和6年度", "question": "製品検査方法の一つに、抜取検査がある。", "answer": "○", "explanation": "全数検査・抜取検査などがあり、抜取検査は代表的な検査方法。"}, {"category": "令和6年度", "question": "平歯車のモジュールと歯数をかけた値は、歯車の外径を表す。", "answer": "×", "explanation": "モジュール×歯数（m×z）は基準円直径（ピッチ円直径）。外径は m(z+2)＝基準円直径＋2モジュール。"}, {"category": "令和6年度", "question": "けがき用コンパスの針先の形状は、丸みを付けて研ぐとよい。", "answer": "×", "explanation": "針先は鋭くとがらせて研ぐ。丸みを付けると正確なけがき線が引けない。"}, {"category": "令和6年度", "question": "摺動面の当たりを良くする方法の一つにきさげ作業がある。", "answer": "○", "explanation": "きさげ（スクレーピング）で摺動面の当たり（接触状態）を調整する。"}, {"category": "令和6年度", "question": "ダイカスト鋳造法には、コールドチャンバ式、ホットチャンバ式等がある。", "answer": "○", "explanation": "溶湯の保持方式によりコールドチャンバ式・ホットチャンバ式に分かれる。"}, {"category": "令和6年度", "question": "アルミニウムは、鉄よりも熱伝導率が小さい。", "answer": "×", "explanation": "アルミニウムの熱伝導率は鉄より大きい（約3倍）。"}, {"category": "令和6年度", "question": "鉄鋼製品を加熱し、徐冷することを焼入れという。", "answer": "×", "explanation": "加熱して徐冷するのは焼なまし（焼鈍）。焼入れは加熱後に急冷する処理。"}, {"category": "令和6年度", "question": "金属材料の引張試験とは、引張試験機等を用いて、材料を徐々に引っ張り、降伏点、耐力、引張強さ等を測定する試験をいう。", "answer": "○", "explanation": "引張試験の定義どおり。応力－ひずみ関係から各特性値を求める。"}, {"category": "令和6年度", "question": "一般に金属は、ある範囲内の大きさまでの荷重であれば、荷重を取り去ると再び元の形に戻る。このような性質を弾性という。", "answer": "○", "explanation": "弾性（弾性変形）の説明として正しい。"}, {"category": "令和6年度", "question": "日本産業規格（JIS）によれば、寸法補助記号「C」で表す面取り角度は、30°である。", "answer": "×", "explanation": "「C」は45°の面取りを表す（Chamfer）。"}, {"category": "令和6年度", "question": "抵抗値50Ωの導体に100 Vの直流電圧を加えたとき、流れる電流は2Aである。", "answer": "○", "explanation": "オームの法則 I＝V/R＝100/50＝2 A。"}, {"category": "令和6年度", "question": "三相誘導電動機は、周波数変換器（インバータ）により回転速度を変えることができる。", "answer": "○", "explanation": "回転速度は周波数に比例するため、インバータで可変速できる。"}, {"category": "令和6年度", "question": "労働安全衛生関係法令によれば、研削といしを取り替えたときは、1分間の試運転をしなければならないと規定されている。" の外径加工において、主軸の回転速度が一定のとき、工作物の直径が大きくなるほど切削速度は遅くなる。", "answer": "×", "explanation": "V＝πDN/1000 より、N一定なら直径Dが大きいほど切削速度は速くなる。"}, {"category": "令和6年度", "question": "日本産業規格（JIS）によれば、工作機械関係では、普通は回転速度を毎分当たりの回転数（min⁻¹）で表す。", "answer": "○", "explanation": "回転速度の単位は min⁻¹（毎分回転数）で表す。"}, {"category": "令和5年度", "question": "中ぐり盤では、主軸と共に回転するバイトで、前もってあけられた下穴をくり広げる加工ができる。", "answer": "○", "explanation": "中ぐり盤は工具（バイト）が主軸とともに回転して下穴を広げる。"}, {"category": "令和5年度", "question": "次に示す切削工具材料の硬度を比較した場合、以下の順序は正しい。（高速度工具鋼 → ダイヤモンド → 超硬合金）", "answer": "×", "explanation": "正しい硬さ順（高→低）は ダイヤモンド → 超硬合金 → 高速度工具鋼。図の順序は誤り。"}, {"category": "令和5年度", "question": "切削油剤は、一般に、不水溶性よりも水溶性のほうが潤滑性がよい。", "answer": "×", "explanation": "潤滑性は不水溶性（油性）のほうが優れる。水溶性は冷却性に優れる。"}, {"category": "令和5年度", "question": "同じ温度において、マシン油の ISO VG10 は、ISO VG32 よりも、動粘度の数値が小さい油である。", "answer": "○", "explanation": "VG値は40℃の動粘度（mm²/s）。VG10＜VG32 なのでVG10のほうが小さい。"}, {"category": "令和5年度", "question": "ピストンポンプは、一般に、ベーンポンプに比べて高吐出圧を得ることができる。", "answer": "○", "explanation": "ピストンポンプは高圧が得られる。ベーンポンプは中・低圧向き。"}, {"category": "令和5年度", "question": "ジグ用ブシュの材質には、一般に、アルミニウムを使用する。", "answer": "×", "explanation": "ブシュは耐摩耗性が必要なため、一般に焼入れした工具鋼などを使う。アルミは軟らかく不適。"}, {"category": "令和5年度", "question": "二つのブロックゲージの測定面を重ね合わせ、密着させることをリンギングという。", "answer": "○", "explanation": "測定面どうしを密着させる操作がリンギング（密着）。"}, {"category": "令和5年度", "question": "特性要因図とは、特定の結果（特性）と要因との関係を系統的に表した図をいう。", "answer": "○", "explanation": "いわゆる「魚の骨（フィッシュボーン／石川ダイヤグラム）」の説明として正しい。"}, {"category": "令和5年度", "question": "平行軸に取り付けられた一対のはすば歯車のねじれ方向は、同じである。", "answer": "×", "explanation": "平行軸でかみ合うはすば歯車のねじれ方向は互いに反対（逆）。"}, {"category": "令和5年度", "question": "けがき作業において、丸棒の端面の中心を求める方法の一つとして、トースカンとVブロックを用いる方法がある。", "answer": "○", "explanation": "Vブロックに丸棒を乗せ、トースカンで中心を求める方法は一般的。"}, {"category": "令和5年度", "question": "日本産業規格（JIS）によれば、鉄工やすりの複目やすりには、上目と下目がある。", "answer": "○", "explanation": "複目やすりは下目（先に付ける目）と上目（交差する目）の2方向の目をもつ。"}, {"category": "令和5年度", "question": "鋳造とは、溶かした金属を型に流し込み、冷却凝固させて製品をつくる方法である。", "answer": "○", "explanation": "鋳造の定義どおり。"}, {"category": "令和5年度", "question": "鋳鉄は、炭素鋼よりも炭素の含有量が少ない。", "answer": "×", "explanation": "鋳鉄は炭素鋼より炭素が多い（鋳鉄≒2.1%以上、炭素鋼≒2%以下）。"}, {"category": "令和5年度", "question": "鉄鋼の硬さを高める目的で行う熱処理のことを焼なましという。", "answer": "×", "explanation": "硬さを高めるのは焼入れ。焼なましは軟らかくする（硬さを下げる）処理。"}, {"category": "令和5年度", "question": "金属材料の硬さを測る方法として、ブリネル硬さ試験、ビッカース硬さ試験、ショア硬さ試験等の方法がある。", "answer": "○", "explanation": "いずれも代表的な硬さ試験法（他にロックウェル硬さ等）。"}, {"category": "令和5年度", "question": "安全率は、次式で表される。（安全率＝許容応力／引張強さ）", "answer": "×", "explanation": "正しくは 安全率＝引張強さ（基準強さ）／許容応力。図の式は分母・分子が逆。", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJEAAAA4CAYAAAD9yxoFAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAABDFSURBVHhe7Zx3lBTFE8cLVFRQMWfFHDCAAVRQMYARMCfUZ0REMecsZsyKOSfMiAoqZkyoKBgwYgATRhTMYOhffWq773r3Zm53b5/wx68/7827nd7Z2dmZmqpvVfVcM6dIIlEDzf3fRKLJJCNK1EwyokTNJCNK1EwyokTNJCNK1EwyokTNJCNK1EwyokTNJCOagXz66afSt29f+eSTT/xIdfz1119y0EEHyTfffONHquP111+XwYMH+7Wmk4yoQoYMGSL9+/e3pU2bNrLuuuv6d0RuvfVWmW222fxaPr///rtMmzatbhk+fLg8+OCD8u233xaNs/z999/+U/n8+++/MnToUPnll1/8SAHGK/n8lVdeab+nVlLvrELefvttmThxol8T+fzzz2WllVaSDTbYQDbZZBPp3Lmz9OjRw78r8sorr0inTp2kQ4cOfkRk0UUXlT333FNatmxp61988YV8/PHHsuaaa0rr1q1tDP78809779RTT5UVVljBxl588UXzOEsssYStA8a2xx57yGWXXSaLLLKIHxUZMWKEfPTRR3LIIYdIu3bt/GhD9tlnH1l11VXlqKOO8iNNIxlRBZxyyiny0EMP+bUCP/74o0ydOlW++uorWXrppWWHHXaQe+65xzwURoF3WX/99aVXr162/QknnCDPPvusPPDAAzLzzDPbWB4PP/yw3HjjjXL66afL5ptvbmPHHnusecOddtpJZp11Vhtba6215N1335Vff/21aJ9TpkwxQzzzzDNlvvnm86MNwYg23XRTM8RaSEZUAYQL9Me8885r6+PHj5d//vlHllxySTMwGDBggIUGLgrGEzNq1CjZb7/9bDn88MMt/J122mny+OOPy1xzzWUXms91795dNtxwQ/NO3bp1k4UXXtjvoWBEGMo555zjR8SMkuPCmBozFsCrPfHEE36twKuvvirLLruszD///H6k4AUJhTfddJN07NjRj5YBI0qURz2DO+CAA2zRMOY0VLkxY8a4rl27up9++sm2Uc/hXnjhBXsdo0bo3nzzTXv9yCOPODUYN3bsWPf888879Vxu2LBh9t7999/v2rdv79Rg3KRJk2wscMwxxzj1Zn6twJdffunU27itttrKTZgwwY9WjhqeU0P0awU+++wz+41qnH6kPMmIKkTFqlPvU7RgEE899ZTfwrnjjjvODRo0yK81BEPaeOONbV8YgOod16VLF7toevfbNhimerwGxphlRMC+NHw69UZ+pDIGDhzollpqKffWW2/5kQLjxo1z y": "令和5年度", "question": "チップブレーカとは、切りくずを適当な長さに切断する目的で、バイトのすくい面に段や溝を設けたものである。", "answer": "○", "explanation": "すくい面の段・溝で切りくずを分断するのがチップブレーカ。"}, {"category": "令和5年度", "question": "切削によってすくい面上に生じる摩耗のうち、くぼみが生じた摩耗をクレータ摩耗という。", "answer": "○", "explanation": "すくい面にできるくぼみ状の摩耗がクレータ摩耗。逃げ面側はフランク摩耗。"}, {"category": "令和4年度", "question": "歯切り盤の一つに、ホブ盤がある。", "answer": "○", "explanation": "ホブ盤はホブ（転造工具）で歯切りを行う代表的な歯切り盤。"}, {"category": "令和4年度", "question": "切削用超硬質工具材料の識別記号Pは、主に鋳鉄の加工に使用される。", "answer": "×", "explanation": "P種は主に鋼の加工用。鋳鉄の加工はK種。"}, {"category": "令和4年度", "question": "一般に、不水溶性切削油剤よりも水溶性切削油剤のほうが冷却作用が優れている。", "answer": "○", "explanation": "水溶性は冷却性に優れる（潤滑性は油性が上）。"}, {"category": "令和4年度", "question": "転がり軸受の潤滑油に使用する油は、回転速度が高いほど、粘度の低いものを使用するとよい。", "answer": "○", "explanation": "高速回転ほど低粘度の油が適する（撹拌抵抗・発熱の抑制）。"}, {"category": "令和4年度", "question": "日本産業規格（JIS）の「油圧・空気圧システム及び機器―用語」によれば、油圧システムに使用するアキュムレータとは、作動油をエネルギー源などに用いるために、加圧状態で蓄える容器をいう。", "answer": "○", "explanation": "アキュムレータ（蓄圧器）の定義どおり。"}, {"category": "令和4年度", "question": "工作機械の剛性が高ければ、加工治具の剛性は低くてもよい。", "answer": "×", "explanation": "加工精度には治具にも十分な剛性が必要。治具が低剛性だと変形して精度が落ちる。"}, {"category": "令和4年度", "question": "ノギスは、比較測定器の一種である。", "answer": "×", "explanation": "ノギスは目盛で寸法を直接読む直接測定器。比較測定器は基準との差を測る器具（ダイヤルゲージ等）。"}, {"category": "令和4年度", "question": "ヒストグラムとは、現象や原因を分類し、データの多い順に並べるとともに、累積和を示し、その大きさを棒グラフで表した図をいう。", "answer": "×", "explanation": "この説明はパレート図のもの。ヒストグラムは区間ごとの度数を柱状に表した度数分布図。"}, {"category": "令和4年度", "question": "平歯車のモジュールと歯数をかけた値は、歯車の外径を表す。", "answer": "×", "explanation": "m×zは基準円直径。外径は m(z+2)。"}, {"category": "令和4年度", "question": "けがき用コンパスの針先の形状は、丸みを付けて研ぐとよい。", "answer": "×", "explanation": "針先は鋭くとがらせて研ぐ。"}, {"category": "令和4年度", "question": "摺動面の当たりを良くする方法の一つにきさげ作業がある。", "answer": "○", "explanation": "きさげで摺動面の当たりを調整する。"}, {"category": "令和4年度", "question": "冷間鍛造とは、素材の金属を0℃以下に冷却して行う鍛造法である。", "answer": "×", "explanation": "冷間鍛造は常温（再結晶温度以下）で行う鍛造。0℃以下に冷やすわけではない。"}, {"category": "令和4年度", "question": "ステンレス鋼は、炭素鋼に比べてさびにくい。", "answer": "○", "explanation": "クロムの不動態皮膜により耐食性が高い。"}, {"category": "令和4年度", "question": "鋼をオーステナイトの状態にした後、冷却剤（水や油）中で急冷してマルテンサイト組織を得るための処理を焼入れという。", "answer": "○", "explanation": "焼入れ（急冷でマルテンサイト化）の定義どおり。"}, {"category": "令和4年度", "question": "日本産業規格（JIS）の「鉄鋼用語（試験）」によれば、曲げ試験とは、通常、試験片を規定の内側半径で規定の角度以上に曲げ、わん曲部の外側の裂けきず、その他の欠点の有無を調べる試験である。", "answer": "○", "explanation": "曲げ試験の定義どおり。"}, {"category": "令和4年度", "question": "ねずみ鋳鉄品のFC200よりもFC350のほうが引張強さは小さい。", "answer": "×", "explanation": "FCの数値は最小引張強さ（N/mm²）。FC350（350）はFC200（200）より引張強さが大きい。"}, {"category": "令和4年度", "question": "日本産業規格（JIS）によれば、幾何特性に用いる記号のうち、下図は平面度を表す。（平行四辺形 ▱）", "answer": "○", "explanation": "平行四辺形の記号は平面度（flatness）で正しい。", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJEAAABkCAYAAACGh9KJAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAepSURBVHhe7d1XaBRbGAfwL4qJvYNRCRZQkSgI9ooGK2qUCPpgCDbEXlDE+qAiIoghhuCLBVH0RYX4IGiwgd1gV0wEY4kGQX0wMRILc/fM+fbe2dk1e5OzM3NO8v/BcL9vVy9x8t8zszNzZpKsEAJQ0IT/C1BvCBEoQ4hAGUIEyhAiUIYQgTKECJQhRKAMIQJlCBEoQ4hAGUIEyowO0Zw5c/5d6nMeecmSJVwR1dTUUF5eHndE9+/ft/+/379/51fgb4w9iz9lyhS6dOkSd6F/SFISV/+f+Kc7/168viH5/fs3NWmSmDGkwWzOxC+8rov778XrdViGDRsW8/W6LEOHDk3oh8PIEF29epWePXvGXePSqlUrrupv06ZNCNHLly/p48eP3DUuV65c4ap+5s6dS5mZmdwlhnEhqqiooBUrVnAnnTlzJuaw3diX4uJiXkNS06ZNadCgQdSsWTN+JTGMC9H27du5gnhWrVrFldS8eXPasmULdwkUSqxRxI/sXLKysqzq6mp+F8IKCgqs5OTkiHVVXl7O7yaWUSPRyJEjuZLEV9T09HRq0aIFvwJhlZWV9PPnT+6I+vbtS927d+cusYzcsQ4T4dm1axd3EPb582e6ePEid1J+fj5XiWdMiA4fPkyPHz/mDmrz9etX+zCIX4wIkRiWS0pK6MePH/yKVFVVxRU49evXjytp+fLlNHnyZO4Sz4gQvXnzhvbv38+dNG/ePK7A6ciRI1xJ4uCklwESjN0nWrRoEVfglJuby5XUpk0bmj17NnfeMCJEfg/PptqxYwc9f/6cO6lLly5ceUf7EJ0+fZorqCtxKcujR4+48xAfL9JWenp6xAGzjh07Wi9evOB3Iay0tNTq1atXxLq6ffs2v+strUeiWMNzKETUv39/7iDs06dPVFZWxh1RcnKyfa7MD9qGSBzrePr0KXf/efXqFVfgNHbsWK6k9evX29cN+UHbEIlPVWFhIXfS3r17uYLadOvWjbKzs7nznhHfzsLGjx/PFTj16NGDK6l169Y0YMAA7rynZYjEeZ8hQ4ZwJ/Xp08feH4JIYpNfXV3NnTRx4kSufMI72FpJS0uL+JaRmppqFRcX87vgtGbNmoh1JRa/GbE5a9u2LQ0ePJg7qM2dO3e48o92IVq7di29f/+eO2nEiBFcgdO ory": "令和3年度", "question": "同じ温度において、マシン油の ISO VG10 は、ISO VG32 よりも、動粘度の数値が小さい油である。", "answer": "○", "explanation": "VG値は40℃の動粘度（mm²/s）。VG10＜VG32 なのでVG10のほうが小さい。"}, {"category": "令和3年度", "question": "油圧回路において、一般に、圧力制御弁は、ニードルやスロットルなどで流路を絞ることによって作動油の油量を制御するものである。", "answer": "×", "explanation": "ニードルやスロットルで流路を絞り油量（流量）を制御するのは流量制御弁。圧力制御弁は圧力を制御する弁（リリーフ弁など）。"}, {"category": "令和3年度", "question": "締金を使って工作物を締め付ける場合、締付ボルトはできるだけ工作物から離して締め付けるほうがよい。", "answer": "×", "explanation": "締付ボルトはできるだけ工作物に近づけるほうが、てこの原理で締付け力が大きくなり良い。"}, {"category": "令和3年度", "question": "角度を測定するものの一つとして、サインバーがある。", "answer": "○", "explanation": "サインバーはブロックゲージと組み合わせて角度を精密に測定・設定する。"}, {"category": "令和3年度", "question": "製品検査方法の一つに、抜取検査がある。", "answer": "○", "explanation": "全数検査・抜取検査などがあり、抜取検査は代表的な検査方法。"}, {"category": "令和3年度", "question": "歯車対の回転軸は、2軸が必ずしも平行であるとは限らない。", "answer": "○", "explanation": "かさ歯車（交差軸）やウォーム・ハイポイド（食い違い軸）など、平行でない歯車対もある。"}, {"category": "令和3年度", "question": "けがき作業において、同じ工作物の個数が多い場合や同じ形状を繰返しけがくときには、テンプレートを使用すると作業を効率的に行うことができる。", "answer": "○", "explanation": "同一形状を多数けがくときはテンプレート（型板）を使うと効率的。"}, {"category": "令和3年度", "question": "機械等によって仕上げた面を、基準定盤とすり合わせて、凹凸面の高い部分をやすりを用いて削り取っていく作業をきさげ作業という。", "answer": "×", "explanation": "きさげ作業は「きさげ（スクレーパ）」という工具で高い部分を削り取る作業。やすりではない。"}, {"category": "令和3年度", "question": "電気抵抗熱を利用して金属を溶接する抵抗溶接の一つにスポット溶接がある。", "answer": "○", "explanation": "スポット溶接（点溶接）は抵抗溶接の代表例。"}, {"category": "令和3年度", "question": "機械構造用炭素鋼鋼材「S45C」の45は、強度（引張強さ）を示している。", "answer": "×", "explanation": "「45」は炭素含有量（約0.45%）を示す。引張強さではない。"}, {"category": "令和3年度", "question": "日本産業規格（JIS）の「金属製品熱処理用語」によれば、金属製品を所定の高温状態から急冷する処理を焼入れという。", "answer": "○", "explanation": "焼入れ＝所定の高温から急冷する処理。定義どおり。"}, {"category": "令和3年度", "question": "金属材料のシャルピー衝撃試験とは、徐々に増加する荷重のもとで材料の変形及び破壊強度を調べる試験である。", "answer": "×", "explanation": "シャルピー衝撃試験は衝撃（瞬間的な）荷重を加えてじん性を調べる試験。徐々に増加する荷重で調べるのは引張試験など。"}, {"category": "令和3年度", "question": "動的荷重の一つに繰返し荷重がある。", "answer": "○", "explanation": "繰返し荷重は時間とともに変化する動的荷重の一種。"}, {"category": "令和3年 /* ===== 共有用：公開ファイル（questions.json）の取得と書き出し ===== */
var PUBVK="examprep:pubver:v5";          // 取り込んだ公開版の識別子
var PUB_URL="questions.json";            // GitHub に置く公開用ファイル
function loadPubVer(){ try{ return localStorage.getItem(PUBVK)||""; }catch(e){ return ""; } }
function applyPublished(payload){
  var arr = Array.isArray(payload) ? payload : (payload && payload.questions);
  if(!Array.isArray(arr)) return false;
  var qs = ensureUniqueIds(arr.map(normalizeQuestion).filter(Boolean));
  if(qs.length===0) return false;
  S.questions=qs; saveQuestions(qs);
  var ver = (payload && payload.version) ? String(payload.version) : hashId(JSON.stringify(qs));
  sSet(PUBVK, ver);
  return true;
}
// 学生（custom=false）は起動時に必ず公開版へ更新。
// 管理者が編集中（custom=true）の場合は force のときだけ取り込む（未公開の編集を守るため）。
function syncFromPublished(force){
  if(S.custom && !force) return Promise.resolve(false);
  return fetch(PUB_URL, {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){
      var ver = (data && data.version) ? String(data.version) : "";
      if(!force && ver && ver===loadPubVer() && !S.custom) return false;
      var changed=applyPublished(data);
      if(changed){ S.custom=false; saveCustom(false); if(S.view==="home"||S.view==="qlist") render(); }
      return changed;
    })
    .catch(function(){ return false; });
}
function exportQuestionsJSON(){
  try{
    var payload={ version:Date.now(), questions:S.questions.map(function(q){
      return { category:q.category, question:q.question, answer:(q.answer?"○":"×"), explanation:q.explanation, image:q.image };
    }) };
    var blob=new Blob([JSON.stringify(payload,null,1)], {type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download="questions.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    showToast("questions.json を書き出しました","ok");
  }catch(e){ showToast("書き出しに失敗しました","bad"); }
}

/* ===== スプレッドシート方式：GoogleスプレッドシートのCSVを問題データにする =====
   文章の○✕問題はスプレッドシートで管理。写真つき問題（15問）はアプリに内蔵。 */
/* ↓↓↓ ここにスプレッドシートのURLを貼り付けてください（手順書を参照） ↓↓↓ */
var SHEET_CSV_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQo9CYupmcF8TK2kcNraeun7mpGeYq12XNj3zLWAAFy78AGDFZskmqwrp2SpIG5hZnkt7zKYaHBctFJ/pub?output=csv";   // 「ウェブに公開」した CSV のURL

var SHEETCK="examprep:sheetcache:v5";
function sheetMode(){ return !!(SHEET_CSV_URL && SHEET_CSV_URL.trim()); }
function imageQuestions(){ return SAMPLE.filter(function(q){ return q.image; }); }
function loadSheetCache(){ try{ var r=localStorage.getItem(SHEETCK); if(r){ var a=ensureUniqueIds(JSON.parse(r).map(normalizeQuestion).filter(Boolean)); if(a.length) return a; } }catch(e){} return null; }
function saveSheetCache(qs){ sSet(SHEETCK, JSON.stringify(qs)); }
// CSV → 行×セルの二次元配列（引用符・セル内の改行/カンマ・""エスケープ・BOMに対応）
function parseCSV(text){
  text=String(text).replace(/^\uFEFF/,"");
  var rows=[], row=[], cur="", inQ=false, i, n=text.length, c;
  for(i=0;i<n;i++){
    c=text.charAt(i);
    if(inQ){
      if(c==='"'){ if(text.charAt(i+1)==='"'){ cur+='"'; i++; } else { inQ=false; } }
      else { cur+=c; }
    } else {
      if(c==='"'){ inQ=true; }
      else if(c===','){ row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==='\r'){ /* skip */ }
      else { cur+=c; }
    }
  }
  if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function csvToBool(v){
  var b=toBool(v);           // ○◯〇/×✕✗/正しい/誤り/まる/ばつ/全角英数 などを広く判定
  if(b!==null) return b;
  var s=String(v||"").trim().toLowerCase();
  if(s==="はい") return true;
  if(s==="いいえ") return false;
  return null;
}
// 画像セルの値を表示できるURLに変換する。
//  ・ふつうの画像URL(https://…png 等)はそのまま使う
//  ・Googleドライブの共有リンクは、直接表示できるURLに変換する
function resolveImageUrl(s){
  s=String(s||"").trim();
  if(!s) return "";
  if(/drive\.google\.com/.test(s) || /docs\.google\.com\/.*\/d\//.test(s)){
    var m = s.match(/\/d\/([A-Za-z0-9_-]{20,})/) || s.match(/[?&]id=([A-Za-z0-9_-]{20,})/);
    if(m) return "https://lh3.googleusercontent.com/d/"+m[1]+"=w1280";
  }
  if(/^https?:\/\//i.test(s)) return s;
  return "";
}
// 1行目はヘッダーとして読み飛ばす。列順：年度 / 問題 / 答え(○×) / 解説 / 画像(URL または ドライブのリンク・任意)
function sheetRowsToQuestions(rows){
  if(!rows||!rows.length) return [];
  var out=[], i, r, cat, q, ans, exp, imgUrl, obj;
  for(i=1;i<rows.length;i++){
    r=rows[i]; if(!r) continue;
    cat=(r[0]||"").trim(); q=(r[1]||"").trim(); ans=csvToBool(r[2]); exp=(r[3]||"").trim();
    if(!q || ans===null) continue;   // 問題文か答えが無い行は飛ばす
    obj={ category:cat, question:q, answer:(ans?"○":"×"), explanation:exp };
    imgUrl=resolveImageUrl(r[4]);
    if(imgUrl) obj.image=imgUrl;   // 画像はURL/ドライブのリンクがあるときだけ使う
    out.push(obj);
  }
  return out;
}
function buildCombined(sheetQs){
  var base=imageQuestions();
  var sheet=(sheetQs||[]).map(normalizeQuestion).filter(Boolean);
  return ensureUniqueIds(base.concat(sheet));
}
function syncFromSheet(force){
  if(!sheetMode()) return Promise.resolve(false);
  var url=SHEET_CSV_URL + (SHEET_CSV_URL.indexOf("?")<0?"?":"&") + "_cb=" + Date.now();
  return fetch(url, {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(text){
      var combined=buildCombined(sheetRowsToQuestions(parseCSV(text)));
      if(combined.length===0) return false;
      S.questions=combined; saveSheetCache(combined);
      if(S.view==="home"||S.view==="qlist") render();
      return true;
    })
    .catch(function(){ return false; });
}

/* ===== GitHub へ直接公開（トークンは管理者の端末内だけに保存。生徒には渡らない） ===== */
var GHCFG="examprep:ghcfg:v1", GHTOK="examprep:ghtok:v1", GHSHA="examprep:ghsha:v1";
function loadGhCfg(){ try{ return JSON.parse(localStorage.getItem(GHCFG))||{}; }catch(e){ return {}; } }
function saveGhCfg(c){ sSet(GHCFG, JSON.stringify(c)); }
function loadGhTok(){ try{ return localStorage.getItem(GHTOK)||""; }catch(e){ return ""; } }
function saveGhTok(t){ try{ if(t) localStorage.setItem(GHTOK,t); else localStorage.removeItem(GHTOK); }catch(e){} }
function ghConfigured(){ var c=loadGhCfg(); return !!(c.owner && c.repo && loadGhTok()); }
function detectRepo(){
  var host=location.hostname, parts=location.pathname.split("/").filter(Boolean), owner="", repo="";
  var m=host.match(/^([^.]+)\.github\.io$/);
  if(m){ owner=m[1]; repo = parts.length ? parts[0] : (owner+".github.io"); }
  return {owner:owner, repo:repo};
}
function utf8ToB64(str){
  var bytes=new TextEncoder().encode(str), bin="", chunk=0x8000, i;
  for(i=0;i<bytes.length;i+=chunk){ bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(bin);
}
function ghHeaders(){ return {"Authorization":"Bearer "+loadGhTok(),"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"}; }
function ghContentsUrl(){ var c=loadGhCfg(), path=(c.path||"questions.json"); return "https://api.github.com/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo)+"/contents/"+path.split("/").map(encodeURIComponent).join("/"); }
function ghGetSha(){
  var c=loadGhCfg(), branch=c.branch||"main";
  return fetch(ghContentsUrl()+"?ref="+encodeURIComponent(branch)+"&t="+Date.now(), {headers:ghHeaders(), cache:"no-store"})
    .then(function(r){ if(r.status===404) return null; if(!r.ok) throw r; return r.json(); })
    .then(function(d){ return d&&d.sha?d.sha:null; });
}
function ghPut(jsonStr, version, sha){
  var c=loadGhCfg(), branch=c.branch||"main";
  var body={ message:"問題を更新 "+new Date(version).toLocaleString("ja-JP"), content:utf8ToB64(jsonStr), branch:branch };
  if(sha) body.sha=sha;
  return fetch(ghContentsUrl(), {method:"PUT", headers:ghHeaders(), body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, status:r.status, data:d}; }, function(){ return {ok:r.ok, status:r.status, data:null}; }); });
}
function publishToGitHub(){
  if(!ghConfigured()){ openSettings(); return; }
  if(S.publishing) return;
  S.publishing=true; render();
  var version=Date.now();
  var payload={ version:version, questions:S.questions.map(function(q){
    return { category:q.category, question:q.question, answer:(q.answer?"○":"×"), explanation:q.explanation, image:q.image };
  })};
  var jsonStr=JSON.stringify(payload,null,1);
  var storedSha=""; try{ storedSha=localStorage.getItem(GHSHA)||""; }catch(e){}
  function onSuccess(res){
    try{ if(res.data&&res.data.content&&res.data.content.sha) localStorage.setItem(GHSHA,res.data.content.sha); }catch(e){}
    sSet(PUBVK, String(version)); S.custom=false; saveCustom(false);
  }
  function attempt(sha){
    return ghPut(jsonStr, version, sha).then(function(res){
      if(res.ok){ onSuccess(res); return true; }
      if(res.status===409 || res.status===422){
        return ghGetSha().then(function(fresh){
          if(!fresh) return Promise.reject(res);
          try{ localStorage.setItem(GHSHA,fresh); }catch(e){}
          return ghPut(jsonStr, version, fresh).then(function(r2){ if(r2.ok){ onSuccess(r2); return true; } return Promise.reject(r2); });
        });
      }
      return Promise.reject(res);
    });
  }
  var run = storedSha ? attempt(storedSha) : ghGetSha().then(function(sha){ return attempt(sha); });
  run.then(function(){
    S.publishing=false; render();
    showToast("公開しました。数分で生徒の画面に反映されます","ok");
  }).catch(function(err){
    S.publishing=false; render();
    var msg="公開に失敗しました。通信状態や設定を確認してください";
    if(err && (err.status===401||err.status===403)) msg="トークンが無効か権限不足です。設定を確認してください";
    else if(err && err.status===404) msg="リポジトリかファイルの場所が違います。設定を確認してください";
    showToast(msg,"bad");
  });
}
function openSettings(){
  var c=loadGhCfg(), d=detectRepo();
  S.ghDraft={ owner:c.owner||d.owner||"", repo:c.repo||d.repo||"", branch:c.branch||"main", path:c.path||"questions.json", token:loadGhTok()||"" };
  S.view="settings"; render();
}
function saveSettings(thenPublish){
  var d=S.ghDraft||{};
  if(!(d.owner&&d.owner.trim()) || !(d.repo&&d.repo.trim())){ showToast("ユーザー名とリポジトリ名を入力してください","bad"); return; }
  saveGhCfg({ owner:d.owner.trim(), repo:d.repo.trim(), branch:(d.branch||"main").trim()||"main", path:(d.path||"questions.json").trim()||"questions.json" });
  saveGhTok((d.token||"").trim());
  try{ localStorage.removeItem(GHSHA); }catch(e){}
  showToast("設定を保存しました","ok");
  S.view="qlist"; render();
  if(thenPublish && ghConfigured()) publishToGitHub();
}

function fileToDataURL(file, maxDim, quality){
  maxDim=maxDim||1280; quality=quality||0.72;
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.width, h=img.height;
        var scale=Math.min(1, maxDim/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        var ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror=reject; img.src=reader.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

var MOCK_COUNT=30, MOCK_SEC=60*60;
var S={
  view:"home",
  questions:loadQuestions(),
  progress:loadProgress(),
  custom:loadCustom(),
  session:null, result:null,
  importText:"", showGuide:false, confirmReplace:false,
  qSearch:"", catFilter:"", resetArm:false, resetT:null, delArm:false, delT:null,
  editDraft:null, editMode:"new",
  ghDraft:null, publishing:false,
  timerId:null
};

function qById(id){ for(var i=0;i<S.questions.length;i++) if(S.questions[i].id===id) return S.questions[i]; return null; }
function getCategories(){ var seen={}, out=[]; S.questions.forEach(function(q){ if(q.category && !seen[q.category]){ seen[q.category]=1; out.push(q.category); } }); return out; }
function getStats(){
  var answered=0,correct=0,seen=0,weak=0,bm=0;
  S.questions.forEach(function(q){ var p=S.progress[q.id]||{c:0,w:0,b:0}; var a=p.c+p.w; answered+=a; correct+=p.c; if(a>0)seen++; if(a>0&&p.w>p.c)weak++; if(p.b)bm++; });
  return {total:S.questions.length, seen:seen, acc: answered?Math.round(correct/answered*100):0, answered:answered, weak:weak, bm:bm};
}
function getReviewIds(){ return S.questions.filter(function(q){ var p=S.progress[q.id]||{c:0,w:0,b:0}; return p.b || (p.w+p.c>0 && p.w>p.c); }).map(function(q){ return q.id; }); }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function orderByCoverage(ids){ return ids.map(function(id){ return {id:id, last:(S.progress[id]&&S.progress[id].last)||0, r:Math.random()}; }).sort(function(a,b){ return a.last-b.last || a.r-b.r; }).map(function(x){ return x.id; }); }

var toastT=null;
function showToast(msg,kind){
  var t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.className="toast "+(kind||"info"); t.textContent=msg;
  clearTimeout(toastT); toastT=setTimeout(function(){ var e=document.getElementById("toast"); if(e&&e.parentNode) e.parentNode.removeChild(e); }, 2800);
}

function startSession(mode, opts){
  opts=opts||{};
  var pool=S.questions.map(function(q){ return q.id; });
  if(opts.category) pool=S.questions.filter(function(q){ return q.category===opts.category; }).map(function(q){ return q.id; });
  var ids;
  if(mode==="review") ids=orderByCoverage(opts.ids||getReviewIds());
  else if(mode==="mock") ids=shuffle(orderByCoverage(pool).slice(0,MOCK_COUNT));
  else ids=orderByCoverage(pool);
  if(ids.length===0){ showToast("対象の問題がありません","bad"); return; }
  S.session={ mode:mode, ids:ids, i:0, answers:{}, startedAt:Date.now(), limitSec: mode==="mock"?MOCK_SEC:null, sel:null, revealed:false, flipped:false };
  S.view="quiz"; render();
}
function recordAnswer(id,ok){
  var p=S.progress[id]||{c:0,w:0,b:0,s:0,last:0};
  S.progress[id]={c:p.c+(ok?1:0), w:p.w+(ok?0:1), b:p.b||0, s:(p.s||0)+1, last:Date.now()};
  saveProgress(S.progress);
}
function answerTF(val){
  var s=S.session; if(!s||s.revealed) return;
  var cq=qById(s.ids[s.i]); var ok=(val===cq.answer);
  recordAnswer(cq.id, ok);
  s.answers[cq.id]={chosen:val, ok:ok}; s.sel=val; s.revealed=true; render();
}
function setMockAnswer(val){
  var s=S.session; var id=s.ids[s.i]; var cq=qById(id);
  s.sel=val; s.answers[id]={chosen:val, ok:(val===cq.answer)}; render();
}
function goTo(idx){
  var s=S.session; var id=s.ids[idx]; var st=s.answers[id];
  s.i=idx; s.sel=st?st.chosen:null; s.revealed=false; s.flipped=false; render();
}
function mockPrev(){ if(S.session.i>0) goTo(S.session.i-1); }
function mockNext(){ var s=S.session; if(s.i+1<s.ids.length) goTo(s.i+1); else finishSession(true); }
function advance(){ var s=S.session; if(s.i+1>=s.ids.length) finishSession(true); else { s.i++; s.sel=null; s.revealed=false; s.flipped=false; render(); } }
function flipCard(){ S.session.revealed=true; S.session.flipped=true; render(); }
function gradeCard(ok){ var s=S.session; var cq=qById(s.ids[s.i]); recordAnswer(cq.id, ok); s.answers[cq.id]={chosen:null, ok:ok}; advance(); }
function toggleBookmark(){
  var s=S.session; if(!s) return; var id=s.ids[s.i];
  var p=S.progress[id]||{c:0,w:0,b:0,s:0,last:0};
  S.progress[id]={c:p.c,w:p.w,b:p.b?0:1,s:p.s||0,last:p.last||0};
  saveProgress(S.progress); render();
}
function finishSession(toResult){
  var s=S.session; if(!s) return;
  stopTimer();
  if(toResult){
    if(s.mode==="mock"){
      Object.keys(s.answers).forEach(function(id){
        var a=s.answers[id]; var p=S.progress[id]||{c:0,w:0,b:0,s:0,last:0};
        S.progress[id]={c:p.c+(a.ok?1:0), w:p.w+(a.ok?0:1), b:p.b||0, s:(p.s||0)+1, last:Date.now()};
      });
      saveProgress(S.progress);
    }
    var answeredIds=s.ids.filter(function(id){ return s.answers[id]; });
    var correct=answeredIds.filter(function(id){ return s.answers[id].ok; }).length;
    var wrongIds=answeredIds.filter(function(id){ return !s.answers[id].ok; });
    var total=s.ids.length, byCat={};
    answeredIds.forEach(function(id){ var c=qById(id).category||"（未分類）"; if(!byCat[c]) byCat[c]={c:0,t:0}; byCat[c].t++; if(s.answers[id].ok) byCat[c].c++; });
    S.result={mode:s.mode,total:total,correct:correct,answered:answeredIds.length,unanswered:total-answeredIds.length,wrongIds:wrongIds,byCat:byCat,durationSec:Math.round((Date.now()-s.startedAt)/1000)};
    S.session=null; S.view="result"; render();
  }else{ S.session=null; S.view="home"; render(); }
}
function fmt(sec){ sec=Math.max(0,sec); var m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }

function startTimer(){ stopTimer(); S.timerId=setInterval(tick,500); }
function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId=null; } }
function tick(){
  var s=S.session;
  if(!s || s.mode!=="mock"){ stopTimer(); return; }
  var rem=s.limitSec-Math.floor((Date.now()-s.startedAt)/1000);
  var el=document.getElementById("timer");
  if(el){ el.textContent="残り "+fmt(Math.max(0,rem))+"　解答 "+Object.keys(s.answers).length+"/"+s.ids.length; if(rem<=60) el.classList.add("low"); }
  if(rem<=0){ stopTimer(); finishSession(true); }
}

function openEditor(mode,q){
  S.editMode=mode; S.delArm=false;
  if(mode==="edit"&&q) S.editDraft={id:q.id,category:q.category,question:q.question,answer:q.answer,explanation:q.explanation,image:q.image||""};
  else S.editDraft={id:null,category:S.catFilter||"",question:"",answer:null,explanation:"",image:""};
  S.view="qedit"; render();
}
function saveQuestion(){
  var d=S.editDraft;
  var base=normalizeQuestion({id:d.id||undefined,category:d.category,question:d.question,answer:d.answer,explanation:d.explanation,image:d.image});
  if(!base){ showToast("問題文と答えを入力してください","bad"); return; }
  var next;
  if(S.editMode==="edit"){
    next=S.questions.map(function(x){ return x.id===d.id?{id:d.id,category:base.category,question:base.question,answer:base.answer,explanation:base.explanation,image:base.image}:x; });
  }else{
    var ids={}; S.questions.forEach(function(x){ ids[x.id]=1; });
    var id=base.id, n=1; while(ids[id]){ id=base.id+"_"+(n++); }
    base.id=id; next=S.questions.concat([base]);
  }
  if(JSON.stringify(next).length>4000000){ showToast("画像の合計が大きすぎます。画像を減らすか小さくしてください","bad"); return; }
  S.questions=next; saveQuestions(next); S.custom=true; saveCustom(true);
  S.view="qlist"; render(); showToast(S.editMode==="edit"?"保存しました":"問題を追加しました","ok");
}
function deleteQuestion(id){
  S.questions=S.questions.filter(function(q){ return q.id!==id; });
  saveQuestions(S.questions);
  delete S.progress[id]; saveProgress(S.progress);
  S.custom=true; saveCustom(true);
  S.view="qlist"; render(); showToast("問題を削除しました","info");
}
function tapDelete(){
  if(S.delArm){ deleteQuestion(S.editDraft.id); }
  else{ S.delArm=true; render(); clearTimeout(S.delT); S.delT=setTimeout(function(){ S.delArm=false; if(S.view==="qedit") render(); },3000); }
}
function onEditorFile(e){
  var f=e.target.files&&e.target.files[0];
  if(!f) return;
  fileToDataURL(f).then(function(url){ S.editDraft.image=url; render(); showToast("画像を読み込みました","ok"); })
  .catch(function(){ showToast("画像を読み込めませんでした","bad"); });
}
function doImport(replace){
  var res=parseImport(S.importText); var parsed=res.questions, skipped=res.skipped;
  if(parsed.length===0){ showToast("問題を読み取れませんでした","bad"); return; }
  var next, prog;
  if(replace){ next=ensureUniqueIds(parsed); prog={}; }
  else{ next=ensureUniqueIds(S.questions.concat(parsed)); prog=S.progress; }
  S.questions=next; saveQuestions(next); S.progress=prog; saveProgress(prog); S.custom=true; saveCustom(true);
  S.importText=""; S.confirmReplace=false; S.view="qlist"; render();
  showToast(parsed.length+"問を"+(replace?"登録":"追加")+"しました"+(skipped?"（"+skipped+"件スキップ）":""),"ok");

function quizHTML(){
  var s=S.session, total=s.ids.length, pos=s.i+1, cq=qById(s.ids[s.i]);
  var isMock=s.mode==="mock", isFlash=s.mode==="flashcard";
  var p=S.progress[cq.id]||{}, bookmarked=!!p.b, last=(s.i+1>=total), a=s.answers[cq.id];
  var rem = s.limitSec!=null ? s.limitSec-Math.floor((Date.now()-s.startedAt)/1000) : 0;
  var answered=Object.keys(s.answers).length;
  function tfClass(val){
    if(!s.revealed) return "tf-btn"+(s.sel===val?" sel":"");
    if(val===cq.answer) return "tf-btn correct";
    if(s.sel===val) return "tf-btn wrong";
    return "tf-btn dim";
  }
  var html='<div class="view quiz">';
  html+='<div class="qbar"><button class="iconbtn" data-act="close" aria-label="終了">'+ic("close",20)+'</button>'
    +'<div class="qprog"><div class="qcount mono">'+String(pos).padStart(2,"0")+' <span class="qcount-d">/ '+total+'</span></div>'
    +'<div class="track"><div class="fill" style="width:'+(pos/total*100)+'%"></div></div></div>'
    +'<button class="iconbtn'+(bookmarked?" on":"")+'" data-act="bm" aria-label="ブックマーク">'+ic("star",20)+'</button></div>';
  if(isMock) html+='<div id="timer" class="timer mono'+(rem<=60?" low":"")+'">残り '+fmt(Math.max(0,rem))+'　解答 '+answered+'/'+total+'</div>';
  html+='<div class="qscroll"><div class="qcard tf-q">'
    +(cq.category?'<span class="chip">'+esc(cq.category)+'</span>':"")
    +(!isFlash?'<div class="qjudge">次の文は正しい？</div>':"")
    +'<div class="qtext">'+esc(cq.question)+'</div>'
    +(cq.image?'<img class="qimg" src="'+cq.image+'" alt="">':"")
    +'</div>';
  if(!isFlash){
    html+='<div class="tf">'
      +'<button class="'+tfClass(true)+'" data-act="'+(isMock?"mans":"ans")+'" data-arg="t"'+(s.revealed?" disabled":"")+'><span class="tf-sym maru">○</span><span class="tf-lbl">正しい</span></button>'
      +'<button class="'+tfClass(false)+'" data-act="'+(isMock?"mans":"ans")+'" data-arg="f"'+(s.revealed?" disabled":"")+'><span class="tf-sym batsu">×</span><span class="tf-lbl">誤り</span></button>'
      +'</div>';
    if(s.revealed){
      html+='<div class="exp '+(a&&a.ok?"ok":"bad")+'"><div class="exp-head">'+ic(a&&a.ok?"check":"close",18)+'<span>'+(a&&a.ok?"正解":"不正解")+'　答えは '+(cq.answer?"○ 正しい":"× 誤り")+'</span></div>'
        +(cq.explanation?'<div class="exp-text">'+esc(cq.explanation)+'</div>':"")+'</div>';
    }
  }else{
    if(!s.flipped) html+='<div class="flash"><button class="flash-front" data-act="flip"><span class="flash-hint">タップして答えを表示</span></button></div>';
    else html+='<div class="flash"><div class="flash-back"><div class="flash-label">答え</div><div class="flash-tf"><span class="flash-sym '+(cq.answer?"maru":"batsu")+'">'+(cq.answer?"○":"×")+'</span><span class="flash-word">'+(cq.answer?"正しい":"誤り")+'</span></div>'+(cq.explanation?'<div class="exp-text">'+esc(cq.explanation)+'</div>':"")+'</div></div>';
  }
  html+='</div>';
  html+='<div class="actionbar">';
  if(isFlash){
    if(s.flipped) html+='<div class="grade"><button class="btn ghost half" data-act="grade" data-arg="0">あいまい</button><button class="btn primary half" data-act="grade" data-arg="1">覚えた</button></div>';
    else html+='<button class="btn primary" data-act="flip">答えを見る</button>';
  }else if(isMock){
    html+='<div class="navrow"><button class="btn ghost half" data-act="mprev"'+(s.i===0?" disabled":"")+'>← 前へ</button><button class="btn primary half" data-act="mnext">'+(last?"採点する":"次へ →")+'</button></div>';
  }else if(s.revealed){
    html+='<button class="btn primary" data-act="advance">'+(last?"結果を見る":"次の問題へ")+'</button>';
  }else{
    html+='<div class="action-hint">○ か × をタップして回答してください</div>';
  }
  html+='</div></div>';
  return html;
}

}

function viewHTML(){
  if(S.view==="home") return homeHTML();
  if(S.view==="quiz" && S.session) return quizHTML();
  if(S.view==="result" && S.result) return resultHTML();
  if(S.view==="qlist") return qlistHTML();
  if(S.view==="qedit" && S.editDraft) return editorHTML();
  if(S.view==="qimport") return importHTML();
  if(S.view==="settings") return settingsHTML();
  return homeHTML();
}

var appEl;
function render(){
  appEl.innerHTML=viewHTML();
  if(S.view==="quiz" && S.session && S.session.mode==="mock"){ if(!S.timerId) startTimer(); }
  else stopTimer();
}

function onClick(e){
  var el=e.target.closest ? e.target.closest("[data-act]") : null;
  if(!el) return;
  var act=el.getAttribute("data-act");
  var arg=el.getAttribute("data-arg");
  switch(act){
    case "go-home": S.view="home"; render(); break;
    case "go-qlist": S.qSearch=""; S.view="qlist"; render(); break;
    case "go-import": S.confirmReplace=false; S.view="qimport"; render(); break;
    case "export-json": exportQuestionsJSON(); break;
    case "publish": publishToGitHub(); break;
    case "go-settings": openSettings(); break;
    case "gh-save": saveSettings(false); break;
    case "gh-save-publish": saveSettings(true); break;
    case "gh-clear": clearToken(); break;
    case "start": startSession(arg); break;
    case "startcat": startSession("practice",{category:arg}); break;
    case "ans": answerTF(arg==="t"); break;
    case "mans": setMockAnswer(arg==="t"); break;
    case "mprev": mockPrev(); break;
    case "mnext": mockNext(); break;
    case "advance": advance(); break;
    case "flip": flipCard(); break;
    case "grade": gradeCard(arg==="1"); break;
    case "bm": toggleBookmark(); break;
    case "close": finishSession(false); break;
    case "review-wrong": startSession("review",{ids:S.result.wrongIds}); break;
    case "retry": startSession(S.result.mode); break;
    case "edit-new": openEditor("new"); break;
    case "edit": openEditor("edit", qById(arg)); break;
    case "set-ans": S.editDraft.answer=(arg==="t"); render(); break;
    case "setcat": S.editDraft.category=arg; render(); break;
    case "save": saveQuestion(); break;
    case "del": tapDelete(); break;
    case "pickimg": var fi=document.getElementById("fileInput"); fi.value=""; fi.click(); break;
    case "rmimg": S.editDraft.image=""; render(); break;
    case "filter": S.catFilter=arg; render(); break;
    case "reset": tapReset(); break;
    case "sheet-refresh":
      if(!S.publishing){ S.publishing=true; render(); syncFromSheet(true).then(function(ok){ S.publishing=false; render(); showToast(ok?"最新の問題を取得しました":"取得できませんでした。通信を確認してください", ok?"ok":"bad"); }); }
      break;
    case "guide": S.showGuide=!S.showGuide; render(); break;
    case "tmpl": S.importText=TEMPLATE; render(); break;
    case "imp-add": doImport(false); break;
    case "imp-replace": doImport(true); break;
    case "imp-confirm": S.confirmReplace=true; render(); break;
    case "imp-cancel": S.confirmReplace=false; render(); break;
  }
}
function onInput(e){
  var el=e.target; var inp=el.getAttribute&&el.getAttribute("data-inp");
  if(!inp) return;
  if(inp==="search"){ S.qSearch=el.value; var b=document.getElementById("qlistbody"); if(b) b.innerHTML=qlistBodyHTML(); }
  else if(inp==="imptext"){ S.importText=el.value; var p=document.getElementById("prev"); if(p) p.innerHTML=prevHTML(); var ia=document.getElementById("impactions"); if(ia) ia.innerHTML=impActionsHTML(); }
  else if(inp==="cat"){ S.editDraft.category=el.value; }
  else if(inp==="q"){ S.editDraft.question=el.value; var sb=document.getElementById("saveBtn"); if(sb) sb.disabled=!(S.editDraft.question.trim() && S.editDraft.answer!==null); }
  else if(inp==="exp"){ S.editDraft.explanation=el.value; }
  else if(inp.indexOf("gh-")===0){ if(!S.ghDraft) S.ghDraft={}; S.ghDraft[inp.slice(3)]=el.value; }
}

document.addEventListener("DOMContentLoaded", function(){
  appEl=document.getElementById("app");
  appEl.addEventListener("click", onClick);
  appEl.addEventListener("input", onInput);
  document.getElementById("fileInput").addEventListener("change", onEditorFile);
  render();
  if(sheetMode()) syncFromSheet(); else syncFromPublished();
});
</script>
</body>
</html>
